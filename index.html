<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rounds — NCLEX-RN study</title>
    <meta name="description" content="Plain-language lessons, flashcards and NCLEX-RN practice questions for a concept-based nursing program, tied to the course materials." />
    <meta name="theme-color" content="#f7f5f1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      try { var t = localStorage.getItem('rounds.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; var z = Number(localStorage.getItem('rounds.zoom')); if (z) document.documentElement.style.fontSize = (z * 100) + '%'; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
